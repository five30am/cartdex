services:
  cartdex:
    image: ghcr.io/five30am/cartdex:latest
    container_name: cartdex
    restart: unless-stopped
    ports:
      - "3500:3000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/cartdex.db
      - ROM_ROOT=/roms
      - SCREENSCRAPER_DEV_ID=${SCREENSCRAPER_DEV_ID}
      - SCREENSCRAPER_DEV_PASSWORD=${SCREENSCRAPER_DEV_PASSWORD}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - CARTDEX_API_TOKEN=${CARTDEX_API_TOKEN}
    volumes:
      - cartdex_data:/data
      - cartdex_artwork:/app/public/artwork
      - /mnt/roms:/roms:rw
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  cartdex_data:
    external: true
    name: cartdex_cartdex_data
  cartdex_artwork:
    external: true
    name: cartdex_cartdex_artwork
