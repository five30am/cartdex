name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/five30am/romvault:latest
            ghcr.io/five30am/romvault:${{ steps.sha.outputs.short }}

      - name: Trigger Portainer redeploy via webhook
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_WEBHOOK_TOKEN: ${{ secrets.PORTAINER_WEBHOOK_TOKEN }}
        run: |
          echo "Triggering Portainer stack webhook..."
          HTTP_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" -X POST \
            "${PORTAINER_URL}/api/stacks/webhooks/${PORTAINER_WEBHOOK_TOKEN}")
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Redeploy triggered successfully."
          else
            echo "ERROR: Webhook returned HTTP $HTTP_STATUS"
            exit 1
          fi
