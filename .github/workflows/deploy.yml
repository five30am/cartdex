name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/five30am/cartdex:latest
            ghcr.io/five30am/cartdex:${{ steps.sha.outputs.short }}

      - name: Trigger Portainer redeploy via API
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_KEY: ${{ secrets.PORTAINER_KEY }}
          CARTDEX_API_TOKEN: ${{ secrets.CARTDEX_API_TOKEN }}
        run: |
          # Stack 52 (cartdex) is a standalone compose stack -- the webhook endpoint
          # POST /api/stacks/webhooks/:token only works for git-backed stacks and will
          # 404 for standalone stacks. Use PUT /api/stacks/:id?endpointId=:endpointId
          # with an explicit API key instead.
          #
          # IMPORTANT: Portainer's PUT endpoint REPLACES the env array -- it does not
          # merge. CARTDEX_API_TOKEN must be included in every PUT or it will be wiped
          # on the next container start, locking all API mutations.

          # Guard: skip gracefully if secrets are not configured.
          if [ -z "${PORTAINER_URL}" ] || [ -z "${PORTAINER_KEY}" ] || [ -z "${CARTDEX_API_TOKEN}" ]; then
            echo "WARNING: One or more required secrets are not set."
            echo "  Required: PORTAINER_URL, PORTAINER_KEY, CARTDEX_API_TOKEN"
            echo "The image was pushed to ghcr.io successfully."
            echo "Manual redeploy needed: Portainer stack 52 on ${PORTAINER_URL:-<unset>}"
            exit 0
          fi

          echo "Fetching current stack file from Portainer..."
          STACK_FILE=$(curl -skf -H "X-API-Key: ${PORTAINER_KEY}" \
            "${PORTAINER_URL}/api/stacks/52/file" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['StackFileContent'])")

          if [ -z "${STACK_FILE}" ]; then
            echo "ERROR: Could not retrieve stack file from Portainer. Manual redeploy needed."
            exit 1
          fi

          echo "Redeploying stack 52 (endpointId=3, pull latest image)..."
          HTTP_STATUS=$(curl -sk -o /tmp/portainer-redeploy.json -w "%{http_code}" \
            -X PUT \
            -H "X-API-Key: ${PORTAINER_KEY}" \
            -H "Content-Type: application/json" \
            "${PORTAINER_URL}/api/stacks/52?endpointId=3" \
            -d "{
              \"stackFileContent\": $(python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' <<< "${STACK_FILE}"),
              \"env\": [{\"name\": \"CARTDEX_API_TOKEN\", \"value\": \"${CARTDEX_API_TOKEN}\"}],
              \"pullImage\": true,
              \"prune\": false
            }")

          echo "Portainer API response: HTTP ${HTTP_STATUS}"
          cat /tmp/portainer-redeploy.json || true

          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 300 ]; then
            echo "Portainer redeploy triggered successfully."
          else
            echo "ERROR: Portainer API returned HTTP ${HTTP_STATUS}. Manual redeploy may be needed."
            exit 1
          fi
