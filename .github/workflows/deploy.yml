name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/five30am/romvault:latest
            ghcr.io/five30am/romvault:${{ steps.sha.outputs.short }}

      - name: Redeploy stack via Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          STACK_FILE=$(curl -sk \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks/42/file" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['StackFileContent'])")

          PAYLOAD=$(python3 -c "
          import json, sys
          content = sys.stdin.read()
          print(json.dumps({'stackFileContent': content, 'env': [], 'prune': False, 'pullImage': True}))
          " <<< "$STACK_FILE")

          HTTP_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" \
            -X PUT \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${PORTAINER_URL}/api/stacks/42?endpointId=3")

          echo "Portainer redeploy response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Portainer redeploy failed with HTTP $HTTP_STATUS"
            exit 1
          fi
