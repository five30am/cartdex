name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/five30am/romvault:latest
            ghcr.io/five30am/romvault:${{ steps.sha.outputs.short }}

      - name: Trigger Portainer redeploy
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_KEY: ${{ secrets.PORTAINER_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess, sys

          url = os.environ["PORTAINER_URL"]
          key = os.environ["PORTAINER_KEY"]
          stack_id = 43
          endpoint_id = 3

          def portainer(method, path, body=None):
              args = ["curl", "-sk", "-X", method,
                      f"{url}/api/{path}",
                      "-H", f"X-API-Key: {key}",
                      "-H", "Content-Type: application/json"]
              if body:
                  args += ["-d", json.dumps(body)]
              r = subprocess.run(args, capture_output=True, text=True)
              return json.loads(r.stdout)

          # 1. Fetch current stack env vars from Portainer (preserve any real values)
          current = portainer("GET", f"stacks/{stack_id}")
          env = current.get("Env") or []

          # 2. Read compose file from repo
          with open("docker-compose.yml") as f:
              compose_content = f.read()

          # 3. PUT to trigger redeploy with current env preserved
          payload = {
              "StackFileContent": compose_content,
              "Env": env
          }

          print(f"Triggering Portainer redeploy for stack {stack_id} (romvault)...")
          response = portainer("PUT", f"stacks/{stack_id}?endpointId={endpoint_id}", payload)

          if "message" in response:
              print(f"ERROR: {response['message']}")
              print(f"Details: {response.get('details', '')}")
              sys.exit(1)
          else:
              print(f"Redeploy successful. Stack: {response.get('Name')}, Status: {response.get('Status')}")
          PYEOF
