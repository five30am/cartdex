<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RomVault — Holocron Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --sand: #c4a46c;
    --sand-light: #d4bb8a;
    --sand-dim: #8a7450;
    --ochre: #b5651d;
    --ochre-glow: #d4862a;
    --rust: #6b3a2a;
    --deep-brown: #1a120b;
    --dark-bg: #0d0a07;
    --panel-bg: #151009;
    --panel-border: #2a1f14;
    --card-bg: #1a1208;
    --card-hover: #221a0f;
    --text-primary: #d4c4a0;
    --text-dim: #7a6b52;
    --text-bright: #e8dcc4;
    --accent-blue: #4a7a9b;
    --accent-blue-dim: #2a4a5b;
    --danger: #8b3a3a;
    --success: #4a6b3a;
    --glow-sand: 0 0 20px rgba(196, 164, 108, 0.15);
    --glow-ochre: 0 0 12px rgba(181, 101, 29, 0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark-bg);
    color: var(--text-primary);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
  }

  /* ═══ TOP NAV ═══ */
  .topnav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 56px;
    background: linear-gradient(180deg, #18120a 0%, #0d0a07 100%);
    border-bottom: 1px solid var(--panel-border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topnav-left {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--ochre) 0%, var(--sand-dim) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: var(--dark-bg);
    box-shadow: var(--glow-ochre);
  }

  .logo-text {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 3px;
    color: var(--sand);
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    gap: 4px;
  }

  .nav-link {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 4px;
    transition: all 0.2s;
    cursor: pointer;
  }

  .nav-link:hover, .nav-link.active {
    color: var(--sand-light);
    background: rgba(196, 164, 108, 0.08);
  }

  .topnav-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--sand-dim);
    background: transparent;
    border: 1px solid var(--panel-border);
    padding: 7px 16px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .nav-btn:hover {
    border-color: var(--sand-dim);
    color: var(--sand);
    background: rgba(196, 164, 108, 0.05);
  }

  .nav-icon-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    font-size: 18px;
  }

  .nav-icon-btn:hover {
    color: var(--sand);
    background: rgba(196, 164, 108, 0.08);
  }

  /* ═══ SYSTEM HEADER ═══ */
  .system-header {
    padding: 28px 32px 24px;
    border-bottom: 1px solid var(--panel-border);
    background: linear-gradient(180deg, rgba(26, 18, 8, 0.5) 0%, transparent 100%);
  }

  .breadcrumb {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 0.2s;
  }

  .breadcrumb:hover { color: var(--sand); }

  .system-title-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .system-badge {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--dark-bg);
    background: linear-gradient(135deg, var(--sand) 0%, var(--ochre) 100%);
    padding: 8px 14px;
    border-radius: 4px;
    box-shadow: var(--glow-sand);
  }

  .system-name {
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    font-size: 32px;
    letter-spacing: 2px;
    color: var(--text-bright);
  }

  .system-meta {
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    color: var(--text-dim);
    margin-top: 4px;
    margin-left: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .system-meta .count {
    color: var(--sand);
    font-weight: 700;
  }

  .system-meta a {
    color: var(--accent-blue);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: all 0.2s;
  }

  .system-meta a:hover {
    border-bottom-color: var(--accent-blue);
  }

  /* ═══ TOOLBAR ═══ */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 32px;
    border-bottom: 1px solid rgba(42, 31, 20, 0.5);
  }

  .search-box {
    flex: 1;
    max-width: 380px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: var(--text-primary);
    background: var(--card-bg);
    border: 1px solid var(--panel-border);
    padding: 10px 14px 10px 40px;
    border-radius: 6px;
    outline: none;
    transition: all 0.2s;
  }

  .search-box input::placeholder {
    color: var(--text-dim);
    font-style: italic;
  }

  .search-box input:focus {
    border-color: var(--sand-dim);
    box-shadow: 0 0 0 2px rgba(196, 164, 108, 0.1);
  }

  .search-box .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 16px;
  }

  .sort-select {
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    letter-spacing: 1px;
    color: var(--text-primary);
    background: var(--card-bg);
    border: 1px solid var(--panel-border);
    padding: 10px 14px;
    border-radius: 6px;
    outline: none;
    cursor: pointer;
  }

  .view-toggles {
    display: flex;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    overflow: hidden;
  }

  .view-btn {
    width: 40px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 17px;
  }

  .view-btn.active {
    background: rgba(196, 164, 108, 0.12);
    color: var(--sand);
  }

  .view-btn:not(:last-child) {
    border-right: 1px solid var(--panel-border);
  }

  .toolbar-spacer { flex: 1; }

  .select-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--panel-border);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .select-btn:hover {
    border-color: var(--sand-dim);
    color: var(--sand);
  }

  /* ═══ MAIN LAYOUT ═══ */
  .main-layout {
    display: flex;
    min-height: calc(100vh - 56px);
  }

  /* ═══ GAME GRID ═══ */
  .game-grid-area {
    flex: 1;
    padding: 24px 28px;
  }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 20px;
  }

  .game-card {
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    group: true;
  }

  .game-card:hover {
    transform: translateY(-4px);
  }

  .game-card:hover .game-thumb {
    border-color: var(--sand-dim);
    box-shadow: var(--glow-sand);
  }

  .game-thumb {
    width: 100%;
    aspect-ratio: 0.72;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--panel-border);
    background: var(--card-bg);
    transition: all 0.25s ease;
    position: relative;
  }

  .game-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Hologram scanline effect on hover */
  .game-card:hover .game-thumb::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      transparent 0%,
      rgba(196, 164, 108, 0.03) 50%,
      transparent 100%
    );
    animation: hologramScan 1.5s linear infinite;
    pointer-events: none;
  }

  @keyframes hologramScan {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
  }

  .game-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, var(--card-bg) 0%, #0f0b06 100%);
    position: relative;
    overflow: hidden;
  }

  .game-placeholder::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 40%, rgba(181, 101, 29, 0.08) 0%, transparent 60%),
      radial-gradient(circle at 70% 70%, rgba(74, 122, 155, 0.05) 0%, transparent 50%);
  }

  .game-placeholder-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--text-dim);
    opacity: 0.5;
    text-transform: uppercase;
  }

  .game-title {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--text-primary);
    margin-top: 8px;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .game-year {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* ═══ FILTER SIDEBAR ═══ */
  .filter-sidebar {
    width: 280px;
    min-width: 280px;
    border-left: 1px solid var(--panel-border);
    padding: 24px 20px;
    background: linear-gradient(270deg, rgba(13, 10, 7, 0.5) 0%, transparent 100%);
  }

  .filter-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .filter-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sand);
  }

  .filter-count {
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
  }

  .filter-section {
    margin-bottom: 24px;
  }

  .filter-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    cursor: pointer;
  }

  .filter-section-title {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-primary);
  }

  .filter-chevron {
    color: var(--text-dim);
    font-size: 14px;
    transition: transform 0.2s;
  }

  .filter-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 2px solid transparent;
  }

  .filter-item:hover {
    background: rgba(196, 164, 108, 0.06);
    border-left-color: var(--sand-dim);
  }

  .filter-item.active {
    background: rgba(196, 164, 108, 0.1);
    border-left-color: var(--ochre);
  }

  .filter-item-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .filter-item.active .filter-item-name {
    color: var(--sand-light);
  }

  .filter-item-count {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  /* ═══ CORNER DECORATIONS ═══ */
  .corner-decor {
    position: fixed;
    pointer-events: none;
    z-index: 50;
  }

  .corner-decor.top-left {
    top: 60px;
    left: 0;
    width: 60px;
    height: 60px;
    border-top: 1px solid var(--panel-border);
    border-left: 1px solid var(--panel-border);
    opacity: 0.4;
  }

  .corner-decor.bottom-right {
    bottom: 0;
    right: 264px;
    width: 60px;
    height: 60px;
    border-bottom: 1px solid var(--panel-border);
    border-right: 1px solid var(--panel-border);
    opacity: 0.4;
  }

  /* ═══ STATUS BAR ═══ */
  .status-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 32px;
    background: var(--panel-bg);
    border-top: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 24px;
    z-index: 100;
  }

  .status-item {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 6px rgba(74, 107, 58, 0.5);
  }

  .status-bar .spacer { flex: 1; }

  /* ═══ AMBIENT EFFECTS ═══ */
  .ambient-glow {
    position: fixed;
    pointer-events: none;
    z-index: -1;
  }

  .ambient-glow.g1 {
    top: -200px;
    right: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(181, 101, 29, 0.04) 0%, transparent 70%);
  }

  .ambient-glow.g2 {
    bottom: -150px;
    left: -100px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(74, 122, 155, 0.03) 0%, transparent 70%);
  }

  /* ═══ AUREBESH-STYLE DECORATIVE TEXT ═══ */
  .deco-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--panel-border);
    text-transform: uppercase;
    user-select: none;
  }

  /* Animations */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .game-card {
    animation: fadeInUp 0.4s ease both;
  }

  .game-card:nth-child(1) { animation-delay: 0.02s; }
  .game-card:nth-child(2) { animation-delay: 0.04s; }
  .game-card:nth-child(3) { animation-delay: 0.06s; }
  .game-card:nth-child(4) { animation-delay: 0.08s; }
  .game-card:nth-child(5) { animation-delay: 0.10s; }
  .game-card:nth-child(6) { animation-delay: 0.12s; }
  .game-card:nth-child(7) { animation-delay: 0.14s; }
  .game-card:nth-child(8) { animation-delay: 0.16s; }
  .game-card:nth-child(9) { animation-delay: 0.18s; }
  .game-card:nth-child(10) { animation-delay: 0.20s; }
  .game-card:nth-child(11) { animation-delay: 0.22s; }
  .game-card:nth-child(12) { animation-delay: 0.24s; }
  .game-card:nth-child(13) { animation-delay: 0.26s; }
  .game-card:nth-child(14) { animation-delay: 0.28s; }
  .game-card:nth-child(15) { animation-delay: 0.30s; }
  .game-card:nth-child(16) { animation-delay: 0.32s; }
  .game-card:nth-child(17) { animation-delay: 0.34s; }
  .game-card:nth-child(18) { animation-delay: 0.36s; }

  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--dark-bg); }
  ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--sand-dim); }

  body { padding-bottom: 32px; }
</style>
</head>
<body>

  <!-- Ambient glows -->
  <div class="ambient-glow g1"></div>
  <div class="ambient-glow g2"></div>

  <!-- Top Navigation -->
  <nav class="topnav">
    <div class="topnav-left">
      <div class="logo">
        <div class="logo-icon">RV</div>
        <span class="logo-text">RomVault</span>
      </div>
      <div class="nav-links">
        <a class="nav-link active">Systems</a>
        <a class="nav-link">All Games</a>
        <a class="nav-link">♦ Favorites</a>
        <a class="nav-link">Publishers</a>
        <a class="nav-link">Series</a>
        <a class="nav-link">Collections</a>
      </div>
    </div>
    <div class="topnav-right">
      <button class="nav-btn">⟳ Scan ROMs</button>
      <button class="nav-btn">↓ Scrape Metadata</button>
      <button class="nav-icon-btn">◐</button>
      <button class="nav-icon-btn">⊞</button>
      <button class="nav-icon-btn">⚙</button>
    </div>
  </nav>

  <!-- System Header -->
  <div class="system-header">
    <div class="breadcrumb">‹ SYSTEMS</div>
    <div class="system-title-row">
      <span class="system-badge">SNES</span>
      <div>
        <div class="system-name">Super Nintendo</div>
        <div class="system-meta">
          <span class="count">1,029</span> games — <a href="#">78 hidden</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input type="text" placeholder="Search the archives..." />
    </div>
    <select class="sort-select">
      <option>TITLE</option>
      <option>YEAR</option>
      <option>RATING</option>
      <option>RECENTLY ADDED</option>
    </select>
    <div class="view-toggles">
      <button class="view-btn active" title="Grid">⊞</button>
      <button class="view-btn" title="List">☰</button>
    </div>
    <div class="toolbar-spacer"></div>
    <button class="select-btn">☐ Select</button>
  </div>

  <!-- Main Content -->
  <div class="main-layout">
    <!-- Game Grid -->
    <div class="game-grid-area">
      <div class="game-grid" id="gameGrid"></div>
    </div>

    <!-- Filter Sidebar -->
    <aside class="filter-sidebar">
      <div class="filter-header">
        <span class="filter-title">Filters</span>
        <span class="filter-count">1,029 games</span>
      </div>

      <div class="filter-section">
        <div class="filter-section-header">
          <span class="filter-section-title">Genre</span>
          <span class="filter-chevron">▴</span>
        </div>
        <div id="genreFilters"></div>
      </div>

      <div class="filter-section">
        <div class="filter-section-header">
          <span class="filter-section-title">Year</span>
          <span class="filter-chevron">▾</span>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-section-header">
          <span class="filter-section-title">Publisher</span>
          <span class="filter-chevron">▾</span>
        </div>
      </div>

      <div style="margin-top: 32px;">
        <span class="deco-text">// archive.holocron.v4.2</span>
      </div>
    </aside>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-item">
      <span class="status-dot"></span>
      ARCHIVE ONLINE
    </div>
    <div class="status-item">SNES // 1,029 ENTRIES</div>
    <div class="status-item">LAST SCAN: 2026.04.14 // 22:17 CST</div>
    <div class="spacer"></div>
    <div class="status-item">ROMVAULT v4.2.0</div>
  </div>

<script>
  // Game data
  const games = [
    { title: "3 Ninjas Kick Back", year: 1994 },
    { title: "90 Minutes: European Prime Goal", year: 1995 },
    { title: "A.S.P.: Air Strike Patrol", year: 1995 },
